# Illustrative context: replace before execution. No real credentials are included.
execution_schema_version: 1
transfers_file: transfers.tsv
runtime_ids: [relay_test.transfer]
execution_context:
  system: relay
  user: transfer
state_dir: /data/state
event_spool: /data/events.tsv
credentials:
  rsync_cluster_writer: &cluster_ssh
    private_key_file: /run/secrets/internal_ssh_key
    known_hosts_file: /run/secrets/known_hosts
  sftp_partner_upload: &partner_ssh
    private_key_file: /run/secrets/partner_sftp_key
    known_hosts_file: /run/secrets/known_hosts
  # Compatibility for already accepted requests using the previous references.
  internal_ssh: *cluster_ssh
  partner_sftp: *partner_ssh
